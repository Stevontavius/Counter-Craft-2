plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'countercraft'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"countercraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client {
			programArgs "--width", "1600", "--height", "900"
			// dev: `gradlew runClient -PquickPlay=<world>` loads straight into run/saves/<world>
			if (project.hasProperty("quickPlay")) {
				programArgs "--quickPlaySingleplayer", project.property("quickPlay").toString()
			}
			// dev: `gradlew runClient -PquickPlayServer=localhost` joins a server (runServerGui's) straight away
			if (project.hasProperty("quickPlayServer")) {
				programArgs "--quickPlayMultiplayer", project.property("quickPlayServer").toString()
			}
			vmArgs "--enable-native-access=ALL-UNNAMED"
		}
		// dev: `gradlew runServerGui` starts a dedicated server with its window (CC2's), in run-server/
		serverGui {
			server()
			serverWithGui()
			name "Server (window)"
			runDir "run-server"
		}
	}
}

// `gradlew testEnv` (test-multiplayer.bat): java argument files for the dev client and the windowed dev server
// (build/testenv/*.args), so the bat can run a server and two clients at once (gradle runs one task at a time)
tasks.register("testEnv") {
	dependsOn "classes", "clientClasses"
	notCompatibleWithConfigurationCache("reads the run tasks' launch setup")
	doLast {
		def out = file("build/testenv")
		out.mkdirs()
		def q = { String a -> def f = a.replace('\\', '/'); f.contains(' ') ? '"' + f + '"' : f }
		// the classpath Loom's own runs use (it passes it in an argument file, which can't nest in another one)
		[client: ["runClient", sourceSets.client], server: ["runServerGui", sourceSets.main]].each { name, run ->
			def t = tasks.getByName(run[0])
			def lines = t.allJvmArgs.findAll { !it.startsWith("@") }.collect { q(it) }
			lines += ["-cp", q(run[1].runtimeClasspath.asPath)]
			lines += t.mainClass.get()
			lines += t.args.collect { q(it) }
			new File(out, "${name}.args").text = lines.join("\n") + "\n"
		}
		println "test launch files written to ${out}"
	}
}

// `gradlew installerJar` (CC2 Installer.bat): the installer, a plain Swing app (src/installer), with the mod, Fabric API
// and Fabric Loader's library list (for the Minecraft Launcher's version file) inside under bundle/
sourceSets {
	installer
	// the BETA installer jar's entry point (Boot), built for Java 8 so whatever Java opens the jar finds a Java 25 for it
	installerBoot
}

tasks.register("installerJar", Jar) {
	notCompatibleWithConfigurationCache("bundles files from the runtime classpath")
	archiveFileName = "countercraft-installer.jar"
	from sourceSets.installer.output
	into("bundle/mods") {
		from tasks.named("jar")
		from { configurations.runtimeClasspath.filter { it.name == "fabric-api-${project.fabric_api_version}.jar" } }
	}
	into("bundle") {
		from({ zipTree(configurations.runtimeClasspath.find { it.name == "fabric-loader-${project.loader_version}.jar" }) }) {
			include "fabric-installer.json"
		}
	}
	manifest {
		attributes "Main-Class": "dev.countercraft.installer.CcInstaller"
	}
}

// `gradlew installerBeta`: the BETA 1.3.1 test build of the installer, in INSTALLERTESTBETA/ (installerJar and its jar stay as
// they are): the same contents, its own folder and name
tasks.register("installerBeta", Jar) {
	notCompatibleWithConfigurationCache("bundles files from the runtime classpath")
	destinationDirectory = file("INSTALLERTESTBETA")
	archiveFileName = "CC2-Installer-Beta-1.3.1-Universal.jar" // the release's names: this, CC2-Installer-Beta-1.3.1-Windows.zip, CC2-Server-Beta-1.3.1.jar
	from sourceSets.installer.output
	from sourceSets.installerBoot.output
	from("LICENSE") {
		into "legal"
	}
	// the converter (our own scripts and measurements), so the installer works on its own: it unpacks them to build the pack
	into("bundle/converter") {
		from("converter") {
			include "*.py", "agent/*.py", "guns.json", "measured/*.json"
		}
	}
	into("bundle/mods") {
		from tasks.named("jar")
		from { configurations.runtimeClasspath.filter { it.name == "fabric-api-${project.fabric_api_version}.jar" } }
	}
	into("bundle") {
		from({ zipTree(configurations.runtimeClasspath.find { it.name == "fabric-loader-${project.loader_version}.jar" }) }) {
			include "fabric-installer.json"
		}
	}
	manifest {
		attributes "Main-Class": "dev.countercraft.installer.Boot", "Implementation-Version": "BETA 1.3.1"
	}
}

// `gradlew installerExe`: the BETA installer as a Windows app with its own Java, so it runs with a double-click on any PC
// (no Java install, no .bat): jpackage's app image in INSTALLERTESTBETA/Counter-Craft 2 Installer/ (the exe with the CC2
// icon, the installer jar under app/, a runtime trimmed to the three modules the installer uses). Zip that folder for a
// release (CC2-Installer-Beta-x-Windows.zip); the installer's self-update keeps the exe and swaps the jar it runs (Updates.java).
tasks.register("installerExe", Exec) {
	notCompatibleWithConfigurationCache("runs jpackage on the installer jar")
	dependsOn "installerBeta"
	def appName = "Counter-Craft 2 Installer"
	def input = file("build/jpackage")
	def dest = file("INSTALLERTESTBETA")
	def jarName = tasks.named("installerBeta").get().archiveFileName.get()
	doFirst {
		delete input, new File(dest, appName)
		copy {
			from tasks.named("installerBeta")
			into input
		}
	}
	executable "${System.getProperty('java.home')}/bin/jpackage"
	args "--type", "app-image", "--name", appName, "--input", input, "--main-jar", jarName,
			"--main-class", "dev.countercraft.installer.CcInstaller", "--icon", file("src/installer/packaging/cc2.ico"),
			"--app-version", project.version, "--vendor", "Counter-Craft 2", "--dest", dest,
			"--add-modules", "java.base,java.desktop,jdk.management",
			"--jlink-options", "--strip-debug --no-header-files --no-man-pages --compress=zip-9"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Brotli decoder for Skinport's price list (Skins Options inventory value); bundled in the jar
	include(implementation("org.brotli:dec:0.1.2"))
}

// the license in the mod's jar (LICENSE_countercraft, as Fabric's template names it)
tasks.named("jar") {
	from("LICENSE") {
		rename { "${it}_countercraft" }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = it.name == "compileInstallerBootJava" ? 8 : 25
	if (it.name == "compileInstallerBootJava") {
		it.options.compilerArgs << "-Xlint:-options" // Java 8 is "obsolete" to javac 25: on purpose here
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
